name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [frontend, backend]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint
      - name: Build static export (frontend only)
        if: matrix.dir == 'frontend'
        working-directory: ${{ matrix.dir }}
        run: |
          npm run build
          npm run export
          test -d out || { echo 'out directory missing'; exit 1; }
      - name: Run tests (frontend only)
        if: matrix.dir == 'frontend'
        working-directory: ${{ matrix.dir }}
        run: |
          npm test
          npm run lighthouse
