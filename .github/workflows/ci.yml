name: CI
on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [frontend, backend]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install deps
        working-directory: ${{ matrix.dir }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint

      - name: Frontend Dev Test
        if: matrix.dir == 'frontend'
        working-directory: ${{ matrix.dir }}
        run: npm run test-dev
      - name: Build and Export (Frontend)
        if: matrix.dir == 'frontend'
        working-directory: ${{ matrix.dir }}
        run: npm run build && npm run export && ls out

      - name: Backend Dev Test
        if: matrix.dir == 'backend'
        working-directory: ${{ matrix.dir }}
        run: npm run test-dev
